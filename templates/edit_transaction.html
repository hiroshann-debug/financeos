{% extends "base.html" %}
{% block title %}Edit Transaction{% endblock %}
{% block page_title %}Edit Transaction{% endblock %}
{% block content %}
<div style="max-width:520px;">
  <div class="mb-6"><h2 style="font-size:1.4rem;font-weight:700;">Edit Transaction</h2></div>
  <div class="card">
    <form method="POST" action="{{ url_for('edit_transaction', transaction_id=transaction.id) }}">
      <div class="form-group"><label class="form-label">Description</label><input type="text" name="description" class="form-control" required value="{{ transaction.description }}"></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Amount</label><input type="number" step="0.01" name="amount" class="form-control" required value="{{ transaction.amount }}"></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" name="category" class="form-control" value="{{ transaction.category or '' }}" list="edit-cats"><datalist id="edit-cats"><option value="Food & Dining"><option value="Transport"><option value="Utilities"><option value="Entertainment"><option value="Shopping"><option value="Health"><option value="Salary"><option value="Other"></datalist></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Type</label><select name="trans_type" class="form-control"><option value="expense" {% if transaction.trans_type=='expense' %}selected{% endif %}>Expense</option><option value="income" {% if transaction.trans_type=='income' %}selected{% endif %}>Income</option></select></div>
        <div class="form-group"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required value="{{ transaction.date.strftime('%Y-%m-%d') if transaction.date else '' }}"></div>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3">{{ transaction.notes or '' }}</textarea></div>
      <div class="flex gap-3 mt-4">
        <a href="{{ url_for('transactions') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
