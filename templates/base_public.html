<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FinanceOS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #f7f7f4;
      --bg2:        #f0f0ec;
      --surface:    #ffffff;
      --surface2:   #f7f7f4;
      --border:     rgba(0,0,0,0.08);
      --border2:    rgba(0,0,0,0.13);
      --text:       #1c1c1a;
      --text2:      #6b6b63;
      --text3:      #a0a098;
      --accent:     #2563eb;
      --accent2:    #1d4ed8;
      --accent-glow:rgba(37,99,235,0.1);
      --green:      #16a34a;
      --red:        #dc2626;
      --orange:     #d97706;
      --radius:     8px;
      --radius-lg:  12px;
      --font:       'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { font-size: 14px; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Plus Jakarta Sans',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; font-weight: 400; }

    /* NAV */
    .pub-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 40px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,11,15,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .pub-nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .pub-nav-logo-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: grid; place-items: center; font-size: 16px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .pub-nav-logo-text { font-size: 1rem; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }
    .pub-nav-links { display: flex; align-items: center; gap: 8px; }
    .pub-nav-link {
      padding: 8px 16px; border-radius: 9px;
      font-size: 0.875rem; font-weight: 500;
      color: var(--text2); text-decoration: none;
      transition: all 0.2s;
    }
    .pub-nav-link:hover { color: var(--text); background: var(--surface); }
    .pub-nav-cta {
      padding: 7px 16px; border-radius: 6px;
      background: var(--accent); color: white;
      font-size: 0.82rem; font-weight: 500;
      text-decoration: none;
      box-shadow: 0 0 16px var(--accent-glow);
      transition: all 0.2s;
    }
    .pub-nav-cta:hover { background: var(--accent2); }

    /* CONTENT */
    .pub-content { padding-top: 64px; }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 10px;
      font-family: var(--font); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: none; text-decoration: none;
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent-glow); }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost { background: var(--surface); color: var(--text2); border: 1px solid var(--border2); }
    .btn-ghost:hover { color: var(--text); background: var(--surface2); }

    /* ALERTS */
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.875rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .alert-success { background: rgba(0,214,143,0.12); color: #00d68f; border: 1px solid rgba(0,214,143,0.2); }
    .alert-danger { background: rgba(255,77,109,0.12); color: #ff4d6d; border: 1px solid rgba(255,77,109,0.2); }
    .alert-warning { background: rgba(255,149,0,0.12); color: #ff9500; border: 1px solid rgba(255,149,0,0.2); }

    /* FOOTER */
    .pub-footer {
      text-align: center; padding: 40px 20px;
      border-top: 1px solid var(--border);
      color: var(--text3); font-size: 0.8rem;
    }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>


<div class="pub-content" style="padding-top:0;margin-top:0;">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div style="max-width:500px;margin:20px auto;padding:0 20px;">
      {% for category, message in messages %}
      <div class="alert alert-{{ 'success' if category=='success' else 'danger' if category=='danger' else 'warning' }}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>


{% block scripts %}{% endblock %}
</body>
</html>
