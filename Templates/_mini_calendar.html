<div class="mini-calendar border rounded p-2" style="max-width: 320px; font-size: 0.85rem;">
  <div class="d-flex justify-content-between fw-bold mb-1">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
  </div>
  <div class="d-flex flex-wrap">
    {% set offset = (month_start.weekday() + 1) % 7 %}
    {% for _ in range(offset) %}
      <div style="width:14.28%;height:60px;"></div>
    {% endfor %}
    {% for day in range(1, month_end.day + 1) %}
      <div style="width:14.28%;height:60px;border:1px solid #ddd;position:relative;" title="{{ calendar_expenses[day]|length }} expense(s)">
        <div style="position:absolute;top:2px;left:4px;font-weight:bold;">{{ day }}</div>
        {% if calendar_expenses[day] %}
          <div style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);">
            {% for exp in calendar_expenses[day] %}
              <span class="badge bg-danger" style="font-size:0.7rem;margin:0 1px;" title="{{ exp.name }}">●</span>
            {% endfor %}
          </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>
</div>
