{% extends "base.html" %}
{% block title %}Edit Loan{% endblock %}
{% block page_title %}Edit Loan{% endblock %}
{% block content %}
<div style="max-width:600px;">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('loan_list') }}" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i></a>
    <h2 style="font-size:1.4rem;font-weight:700;">Edit — {{ loan.loan_name }}</h2>
  </div>
  <div class="card">
    <form method="POST" action="{{ url_for('edit_loan', loan_id=loan.id) }}">
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Loan Name</label><input type="text" name="loan_name" class="form-control" required value="{{ loan.loan_name }}"></div>
        <div class="form-group"><label class="form-label">Lender</label><input type="text" name="lender_name" class="form-control" required value="{{ loan.lender_name }}"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Principal Amount</label><input type="number" step="0.01" name="principal_amount" class="form-control" required value="{{ loan.principal_amount }}"></div>
        <div class="form-group"><label class="form-label">Outstanding Balance</label><input type="number" step="0.01" name="outstanding_balance" class="form-control" required value="{{ loan.outstanding_balance }}"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Interest Rate (%)</label><input type="number" step="0.01" name="interest_rate" class="form-control" required value="{{ loan.interest_rate }}"></div>
        <div class="form-group"><label class="form-label">Loan Term (months)</label><input type="number" name="loan_term" class="form-control" required value="{{ loan.loan_term }}"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Monthly Payment</label><input type="number" step="0.01" name="monthly_payment" class="form-control" required value="{{ loan.monthly_payment }}"></div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="loan_status" class="form-control">
            <option {% if loan.loan_status=='Active' %}selected{% endif %}>Active</option>
            <option {% if loan.loan_status=='Paid Off' %}selected{% endif %}>Paid Off</option>
            <option {% if loan.loan_status=='Defaulted' %}selected{% endif %}>Defaulted</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" required value="{{ loan.start_date.strftime('%Y-%m-%d') if loan.start_date else '' }}"></div>
        <div class="form-group"><label class="form-label">Next Due Date</label><input type="date" name="next_due_date" class="form-control" required value="{{ loan.next_due_date.strftime('%Y-%m-%d') if loan.next_due_date else '' }}"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Repayment Wallet <span style="color:var(--text3);font-weight:400;">(deducted when payment recorded)</span></label>
        <select name="wallet_id" class="form-control">
          <option value="">None</option>
          {% for w in wallets %}
          <option value="{{ w.id }}" {% if loan.wallet_id == w.id %}selected{% endif %}>{{ w.name }} ({{ "{:,.0f}".format(w.balance) }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3">{{ loan.notes or '' }}</textarea></div>
      <div class="flex gap-3 mt-4">
        <a href="{{ url_for('loan_list') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
