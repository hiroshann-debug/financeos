{% extends "base_public.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;">
  <div>
    <div style="font-size:6rem;font-weight:800;color:var(--red);letter-spacing:-0.04em;line-height:1;margin-bottom:8px;">500</div>
    <div style="font-size:1.4rem;font-weight:700;margin-bottom:12px;">Something went wrong</div>
    <p style="color:var(--text2);margin-bottom:32px;max-width:360px;">An unexpected error occurred. Please try again or go back to the dashboard.</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <a href="javascript:history.back()" class="btn btn-ghost">← Go Back</a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
